name: Build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B verify
  demo:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: mvn -B install -DskipTests
      - working-directory: demo
        run: |
          mvn -B dependency:list | tee output.txt
          grep -q "Downloaded from jenesis.build: .*build.jenesis-0.15.5.jar" output.txt
          grep -q "build.jenesis:build.jenesis.launcher:jar:" output.txt
